name: scrape-rpl

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Скрейп расписания РПЛ
        run: python scripts/scrape_rpl.py data/rpl.json

      - name: Коммит и пуш обновления
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rpl.json
          git diff --cached --quiet || git commit -m "chore: обновить расписание РПЛ"
          git push
