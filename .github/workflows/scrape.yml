name: scrape-rpl

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить curl-impersonate
        run: |
          curl -sS -L -o /tmp/cimp.tar.gz \
            "https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz"
          tar xzf /tmp/cimp.tar.gz -C /usr/local/bin curl-impersonate-chrome
          chmod +x /usr/local/bin/curl-impersonate-chrome
          /usr/local/bin/curl-impersonate-chrome --version | head -1

      - name: Скрейп расписания РПЛ
        run: python scripts/scrape_rpl.py data/rpl.json

      - name: Коммит и пуш обновления
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rpl.json
          git diff --cached --quiet || git commit -m "chore: обновить расписание РПЛ"
          git push
